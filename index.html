<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Production Dashboard | Pasifik Harvest Indonesia</title>
    
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> 
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* --- CSS SAMA SEPERTI SEBELUMNYA --- */
        :root {
            --bg-body: #0f172a; --bg-card: #1e293b; --bg-header: rgba(15, 23, 42, 0.95);
            --border: #334155; --text-main: #f8fafc; --text-muted: #94a3b8;
            --primary: #38bdf8; --primary-dim: rgba(56, 189, 248, 0.1);
            --success: #22c55e; --warning: #f59e0b; --danger: #ef4444; --purple: #a855f7;
            --radius: 12px; --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); --transition: all 0.3s ease;
        }
        [data-theme="light"] {
            --bg-body: #f1f5f9; --bg-card: #ffffff; --bg-header: rgba(255, 255, 255, 0.95);
            --border: #e2e8f0; --text-main: #0f172a; --text-muted: #64748b;
            --primary: #0284c7; --primary-dim: rgba(2, 132, 199, 0.1); --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg-body); color: var(--text-main); transition: var(--transition); padding-bottom: 80px; }
        
        .flex-center { display: flex; align-items: center; justify-content: center; }
        .flex-between { display: flex; align-items: center; justify-content: space-between; }
        .hidden { display: none !important; }
        .text-success { color: var(--success); } .text-warning { color: var(--warning); } .text-danger { color: var(--danger); }
        
        header { position: sticky; top: 0; z-index: 50; background: var(--bg-header); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 1rem 1.5rem; }
        .brand { gap: 12px; font-weight: 800; font-size: 1.25rem; color: var(--primary); letter-spacing: -0.5px; }
        
        .nav-controls button, .nav-controls select { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); padding: 8px 16px; border-radius: 8px; font-size: 0.875rem; font-weight: 500; cursor: pointer; transition: var(--transition); }
        .nav-controls button:hover { border-color: var(--primary); color: var(--primary); }

        .container { max-width: 1440px; margin: 0 auto; padding: 24px; }
        .grid-dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); position: relative; overflow: hidden; transition: transform 0.2s; }
        .card:hover { transform: translateY(-4px); border-color: var(--primary); }
        .card-header { margin-bottom: 15px; }
        .card-title { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .card-value { font-size: 1.75rem; font-weight: 800; color: var(--text-main); margin: 5px 0; }
        
        .oee-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 15px; padding-top: 15px; border-top: 1px dashed var(--border); }
        .oee-item { text-align: center; }
        .oee-label { font-size: 0.65rem; font-weight: 700; color: var(--text-muted); margin-bottom: 2px; }
        .oee-val { font-size: 0.85rem; font-weight: 700; }

        .status-pill { padding: 4px 8px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; background: var(--bg-body); border: 1px solid var(--border); }
        
        #loadingOverlay { position: fixed; inset: 0; background: var(--bg-body); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s; }
        .loader { width: 48px; height: 48px; border: 5px solid var(--border); border-bottom-color: var(--primary); border-radius: 50%; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 1000; display: none; align-items: center; justify-content: center; }
        .modal-content { background: var(--bg-card); padding: 30px; border-radius: 16px; width: 100%; max-width: 400px; border: 1px solid var(--border); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); }

        @media (max-width: 768px) {
            header { display: none; }
            .mobile-header { display: flex; padding: 15px; background: var(--bg-header); position: sticky; top: 0; z-index: 50; border-bottom: 1px solid var(--border); }
            .container { padding: 15px; }
            .grid-dashboard { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div id="loadingOverlay">
        <div class="loader"></div>
        <p style="margin-top: 15px; font-weight: 600; color: var(--text-muted)">Initializing System...</p>
    </div>

    <div id="authModal" class="modal-backdrop flex-center" style="display: flex;">
        <div class="modal-content">
            <div class="flex-center" style="margin-bottom: 20px;">
                <h2 style="margin:0; color: var(--primary);">PHI DASHBOARD</h2>
            </div>
            <div style="margin-bottom: 15px;">
                <label style="font-size: 12px; font-weight: 600; color: var(--text-muted);">USERNAME</label>
                <input type="text" id="username" class="card" style="width: 100%; padding: 10px; margin-top: 5px;" placeholder="Enter: admin">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="font-size: 12px; font-weight: 600; color: var(--text-muted);">PASSWORD</label>
                <input type="password" id="password" class="card" style="width: 100%; padding: 10px; margin-top: 5px;" placeholder="Enter: admin123">
            </div>
            <button onclick="App.Auth.login()" style="width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">ACCESS SYSTEM</button>
        </div>
    </div>

    <div id="appContent" class="hidden">
        <header class="flex-between">
            <div class="brand flex-center">
                <span>OEE SYSTEM</span>
                <span style="font-size: 0.8rem; background: var(--primary-dim); padding: 4px 8px; border-radius: 6px;" id="clock">00:00:00</span>
            </div>
            <div class="nav-controls flex-center" style="gap: 10px;">
                <div id="connectionStatus" style="font-size: 12px; font-weight: 600; color: var(--text-muted);">Connecting...</div>
                <button onclick="App.UI.toggleTheme()">Theme</button>
                <button onclick="App.Auth.logout()" class="text-danger" style="border-color: var(--danger);">Logout</button>
            </div>
        </header>

        <div class="mobile-header flex-between">
            <span style="font-weight: 700; font-size: 1.1rem; color: var(--primary);">PHI MOBILE</span>
            <button onclick="App.UI.toggleTheme()" style="background: none; border: none; color: var(--text-main); font-size: 1.2rem;">◑</button>
        </div>

        <div class="container">
            <div style="margin-bottom: 30px;">
                <h3 style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 15px;">GLOBAL PERFORMANCE</h3>
                <div class="grid-dashboard" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
                    <div class="card" style="border-left: 4px solid var(--purple);">
                        <div class="card-title">TOTAL PRODUCTION</div>
                        <div class="card-value" id="totalProd">0</div>
                        <small class="text-muted">Units Today</small>
                    </div>
                    <div class="card" style="border-left: 4px solid var(--success);">
                        <div class="card-title">AVG AVAILABILITY</div>
                        <div class="card-value text-success" id="avgAvail">0%</div>
                    </div>
                    <div class="card" style="border-left: 4px solid var(--warning);">
                        <div class="card-title">AVG PERFORMANCE</div>
                        <div class="card-value text-warning" id="avgPerf">0%</div>
                    </div>
                    <div class="card" style="border-left: 4px solid var(--primary);">
                        <div class="card-title">GLOBAL OEE SCORE</div>
                        <div class="card-value" style="color: var(--primary);" id="avgOee">0%</div>
                    </div>
                </div>
            </div>

            <div class="card" style="margin-bottom: 30px; min-height: 400px;">
                <div class="flex-between card-header">
                    <span class="card-title">PRODUCTION TREND</span>
                    <div class="nav-controls">
                        <button onclick="App.Charts.setPeriod('daily')">Daily</button>
                        <button onclick="App.Charts.setPeriod('weekly')">Weekly</button>
                    </div>
                </div>
                <div style="height: 320px; width: 100%;">
                    <canvas id="productionChart"></canvas>
                </div>
            </div>

            <div style="margin-bottom: 15px;" class="flex-between">
                <h3 style="color: var(--text-muted); font-size: 0.9rem;">LINE DETAILS (1-15)</h3>
                <button class="nav-controls" onclick="App.Data.manualReset()" style="background: var(--bg-card); color: var(--danger); border: 1px solid var(--danger); padding: 5px 10px; border-radius: 6px; cursor: pointer;">Reset All</button>
            </div>
            
            <div class="grid-dashboard" id="linesContainer"></div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const Config = {
            firebase: {
                apiKey: "AIzaSyAC8Il1tbSGONHO6mLdEoe698XVnYmoJTY",
                authDomain: "iot-cntr.firebaseapp.com",
                databaseURL: "https://iot-cntr-default-rtdb.asia-southeast1.firebasedatabase.app",
                projectId: "iot-cntr",
                storageBucket: "iot-phi.firebasestorage.app",
                messagingSenderId: "634140620662",
                appId: "1:634140620662:web:12912eb4d52002f1966c57"
            },
            mqtt: {
                host: "wss://72ebeae451364089a9ebe5b5f5702548.s1.eu.hivemq.cloud:8884/mqtt",
                options: { username: "admin", password: "Admin123", reconnectPeriod: 5000 }
            },
            machines: [
                { id: 'L1', name: 'Line 01', cpm: 70, machineId: 'machine01' },
                { id: 'L2', name: 'Line 02', cpm: 70, machineId: 'machine01' },
                { id: 'L3', name: 'Line 03', cpm: 70, machineId: 'machine02' },
                { id: 'L4', name: 'Line 04', cpm: 70, machineId: 'machine02' },
                { id: 'L5', name: 'Line 05', cpm: 80, machineId: 'machine03' },
                { id: 'L6', name: 'Line 06', cpm: 80, machineId: 'machine03' },
                { id: 'L7', name: 'Line 07', cpm: 70, machineId: 'machine04' },
                { id: 'L8', name: 'Line 08', cpm: 70, machineId: 'machine04' },
                { id: 'L9', name: 'Line 09', cpm: 70, machineId: 'machine05' },
                { id: 'L10', name: 'Line 10', cpm: 70, machineId: 'machine05' },
                { id: 'L11', name: 'Line 11', cpm: 70, machineId: 'machine06' },
                { id: 'L12', name: 'Line 12', cpm: 70, machineId: 'machine06' }
            ]
        };

        // --- STATE MANAGEMENT ---
        const State = {
            counters: {},
            startTime: Date.now(),
            manualOffset: 0,
            isConnected: { mqtt: false, firebase: false },
            chartInstance: null
        };

        // --- SERVICES ---
        const Services = {
            db: null,
            mqttClient: null,

            init() {
                // Init Firebase (Compat Mode)
                if (!firebase.apps.length) {
                    firebase.initializeApp(Config.firebase);
                }
                this.db = firebase.database();
                
                // Read Config
                this.db.ref('config').on('value', (snap) => {
                    const val = snap.val();
                    if(val) {
                        State.startTime = val.productionStartTime || Date.now();
                        State.manualOffset = val.manualOffset || 0;
                        UI.updateDashboard();
                    }
                    State.isConnected.firebase = true;
                    UI.updateStatus();
                });

                this.connectMQTT();
            },

            connectMQTT() {
                this.mqttClient = mqtt.connect(Config.mqtt.host, Config.mqtt.options);
                
                this.mqttClient.on('connect', () => {
                    State.isConnected.mqtt = true;
                    UI.updateStatus();
                    console.log("MQTT Connected");
                    const uniqueMachines = [...new Set(Config.machines.map(m => m.machineId))];
                    uniqueMachines.forEach(mId => {
                        this.mqttClient.subscribe(`iot/esp32/${mId}/counter`);
                    });
                });

                this.mqttClient.on('message', (topic, message) => {
                    try {
                        const data = JSON.parse(message.toString());
                        if(data.counter) {
                            Object.assign(State.counters, data.counter);
                            UI.updateDashboard();
                        }
                    } catch (e) { console.error("MQTT Parse Error", e); }
                });

                this.mqttClient.on('offline', () => {
                    State.isConnected.mqtt = false;
                    UI.updateStatus();
                });
            },

            calculateOEE(lineId, actual) {
                const lineConf = Config.machines.find(m => m.id === lineId) || { cpm: 70 };
                const elapsedMins = (Date.now() - State.startTime) / 60000;
                
                const target = Math.floor(elapsedMins * lineConf.cpm);
                const performance = target > 0 ? (actual / target) : 0;
                const availability = 1.0; 
                const quality = 1.0; 
                const oee = performance * availability * quality;

                return {
                    target,
                    performance: Math.min(performance * 100, 100).toFixed(1),
                    availability: (availability * 100).toFixed(1),
                    quality: (quality * 100).toFixed(1),
                    oee: Math.min(oee * 100, 100).toFixed(1)
                };
            },

            async resetSystem() {
                if(!confirm("Are you sure you want to RESET all counters?")) return;
                
                const historyEntry = {
                    timestamp: Date.now(),
                    date: new Date().toLocaleString(),
                    counters: { ...State.counters },
                    total: parseInt(document.getElementById('totalProd').innerText.replace(/,/g,''))
                };
                
                try {
                    await this.db.ref('history').push(historyEntry);
                    
                    const uniqueMachines = [...new Set(Config.machines.map(m => m.machineId))];
                    uniqueMachines.forEach(mId => {
                        this.mqttClient.publish(`iot/esp32/${mId}/cmd`, JSON.stringify({cmd: "RESET", source: "web"}));
                    });

                    await this.db.ref('config').set({
                        productionStartTime: Date.now(),
                        manualOffset: 0
                    });

                    State.counters = {};
                    Swal.fire("Success", "System has been reset & saved.", "success");
                } catch (error) {
                    Swal.fire("Error", "Failed to reset system: " + error.message, "error");
                }
            }
        };

        // --- UI MANAGER ---
        const UI = {
            init() {
                this.renderLineCards();
                this.initChart();
                setInterval(() => this.updateClock(), 1000);
                setInterval(() => this.updateDashboard(), 5000);
                
                // Hide Loader
                setTimeout(() => {
                    document.getElementById('loadingOverlay').classList.add('hidden');
                }, 1000);
            },

            renderLineCards() {
                const container = document.getElementById('linesContainer');
                container.innerHTML = Config.machines.map(m => `
                    <div class="card" id="card-${m.id}">
                        <div class="flex-between card-header">
                            <div>
                                <div class="card-title">${m.name}</div>
                                <span class="status-pill text-muted">Waiting...</span>
                            </div>
                            <div class="status-pill">${m.cpm} CPM</div>
                        </div>
                        <div class="flex-between">
                            <div>
                                <div class="text-muted" style="font-size: 10px; font-weight:700;">ACTUAL</div>
                                <div class="card-value val-actual" id="val-${m.id}">0</div>
                            </div>
                            <div style="text-align:right">
                                <div class="text-muted" style="font-size: 10px; font-weight:700;">TARGET</div>
                                <div class="card-value" style="color:var(--text-muted); font-size: 1.2rem;" id="target-${m.id}">0</div>
                            </div>
                        </div>
                        <div class="oee-row">
                            <div class="oee-item"><div class="oee-label">AVAIL</div><div class="oee-val text-success" id="avail-${m.id}">0%</div></div>
                            <div class="oee-item"><div class="oee-label">PERF</div><div class="oee-val text-warning" id="perf-${m.id}">0%</div></div>
                            <div class="oee-item"><div class="oee-label">QUAL</div><div class="oee-val text-success" id="qual-${m.id}">0%</div></div>
                            <div class="oee-item"><div class="oee-label">OEE</div><div class="oee-val" style="color:var(--purple)" id="oee-${m.id}">0%</div></div>
                        </div>
                    </div>
                `).join('');
            },

            updateDashboard() {
                let globalTotal = 0;
                let sumOee = 0;
                let count = 0;

                Config.machines.forEach(m => {
                    const actual = State.counters[m.id] || 0;
                    const calculations = Services.calculateOEE(m.id, actual);

                    this.setValidText(`val-${m.id}`, actual);
                    this.setValidText(`target-${m.id}`, calculations.target);
                    this.setValidText(`avail-${m.id}`, calculations.availability + '%');
                    this.setValidText(`perf-${m.id}`, calculations.performance + '%');
                    this.setValidText(`oee-${m.id}`, calculations.oee + '%');

                    globalTotal += actual;
                    sumOee += parseFloat(calculations.oee);
                    count++;
                });

                const avgOee = count > 0 ? (sumOee / count).toFixed(1) : 0;
                this.setValidText('totalProd', (globalTotal + State.manualOffset).toLocaleString());
                this.setValidText('avgOee', avgOee + '%');
                
                Config.machines.forEach(m => {
                    const el = document.getElementById(`oee-${m.id}`);
                    if(el) {
                        const oee = parseFloat(el.innerText);
                        const card = document.getElementById(`card-${m.id}`);
                        card.style.borderLeft = `4px solid ${oee >= 85 ? 'var(--success)' : oee >= 60 ? 'var(--warning)' : 'var(--danger)'}`;
                    }
                });
            },

            setValidText(id, val) {
                const el = document.getElementById(id);
                if(el && el.innerText != val) el.innerText = val;
            },

            updateStatus() {
                const el = document.getElementById('connectionStatus');
                if(State.isConnected.mqtt && State.isConnected.firebase) {
                    el.innerText = "● SYSTEM ONLINE";
                    el.style.color = "var(--success)";
                } else {
                    el.innerText = "○ CONNECTING...";
                    el.style.color = "var(--warning)";
                }
            },

            updateClock() {
                const now = new Date();
                document.getElementById('clock').innerText = now.toLocaleTimeString('id-ID');
            },

            toggleTheme() {
                const html = document.documentElement;
                const current = html.getAttribute('data-theme');
                const next = current === 'dark' ? 'light' : 'dark';
                html.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
            },

            initChart() {
                const ctx = document.getElementById('productionChart').getContext('2d');
                State.chartInstance = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['08:00', '09:00', '10:00', '11:00', '12:00', '13:00', '14:00'],
                        datasets: [{
                            label: 'Hourly Output',
                            data: [1200, 1900, 300, 500, 200, 300, 100],
                            backgroundColor: '#38bdf8',
                            borderRadius: 4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { grid: { color: '#334155', borderDash: [5, 5] } },
                            x: { grid: { display: false } }
                        }
                    }
                });
            }
        };

        // --- AUTH SYSTEM ---
        const Auth = {
            login() {
                const u = document.getElementById('username').value;
                const p = document.getElementById('password').value;
                if(u === "admin" && p === "admin123") {
                    document.getElementById('authModal').style.display = 'none';
                    document.getElementById('appContent').classList.remove('hidden');
                    
                    document.getElementById('loadingOverlay').classList.remove('hidden');
                    
                    localStorage.setItem('isAuth', 'true');
                    Services.init();
                    UI.init();
                } else {
                    Swal.fire("Error", "Invalid Credentials", "error");
                }
            },
            logout() {
                localStorage.removeItem('isAuth');
                location.reload();
            },
            check() {
                const loading = document.getElementById('loadingOverlay');
                
                if(localStorage.getItem('isAuth')) {
                    document.getElementById('authModal').style.display = 'none';
                    document.getElementById('appContent').classList.remove('hidden');
                    Services.init();
                    UI.init(); 
                } else {
                    // Jika belum login, pastikan modal muncul
                    if(loading) loading.classList.add('hidden');
                    document.getElementById('authModal').style.display = 'flex';
                }
            }
        };

        // --- EXPOSE TO GLOBAL WINDOW ---
        // Dengan script biasa, ini sebenarnya otomatis global,
        // tapi kita definisikan eksplisit agar aman.
        window.App = { 
            Auth: Auth, 
            UI: UI, 
            Data: { manualReset: () => Services.resetSystem() }, 
            Charts: { setPeriod: (p) => alert("Feature: " + p) } 
        };

        // --- BOOTSTRAP ---
        window.onload = () => {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            
            setTimeout(() => {
                Auth.check();
            }, 500); 
        };
    </script>
</body>
</html>
